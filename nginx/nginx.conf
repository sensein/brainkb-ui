# Reverse proxy for the BrainKB stack.
#
# Single public origin, path-prefix routing. Each backend service gets its
# own URL prefix; nginx strips the prefix on the way through (`proxy_pass`
# with a trailing slash) so upstreams keep their existing /api/* routes.
#
# Front this with TLS (an AWS ALB, CloudFront, or `certbot --nginx`). For
# AWS, the typical layout is:
#
#     Browser ──HTTPS──▶ ALB ──HTTP──▶ this nginx ──▶ {ui, ml, query, ...}
#
# All upstream hostnames resolve via Docker DNS on the shared
# `brainkb-network`. Container names match the BrainKB unified compose:
#
#     brainkb-unified  → 8004 (user-mgmt), 8007 (ml), 8010 (query)
#     brainkb-chat     → 8011 (chat_service, optional)
#     web              → 3000 (this UI)

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket / SSE upgrade map. Most "regular" requests have no Upgrade
    # header, in which case we want Connection: close (not "upgrade").
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Generous limits — review export blobs and PDF uploads can be multi-MB.
    client_max_body_size 200M;
    proxy_read_timeout   600s;
    proxy_send_timeout   600s;

    # Use Docker's embedded DNS so unknown / not-yet-started service names
    # resolve lazily at request time instead of breaking nginx startup
    # (matters for chat_service, which lives outside the unified compose).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Common proxy headers — keep `X-Forwarded-Proto` accurate for the UI's
    # NextAuth callbacks (it builds OAuth callback URLs from these).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    server {
        listen 80 default_server;
        server_name _;

        # ── User management (auth, users, admin, RBAC, /api/token) ─────
        # NEXT_PUBLIC_USER_MANAGEMENT_API_BASE = https://<host>/usermgmt
        location /usermgmt/ {
            set $upstream_usermgmt http://brainkb-unified:8004;
            proxy_pass $upstream_usermgmt/;
        }

        # ── ML service: SynthScholar, NER, structured resources ────────
        # NEXT_PUBLIC_ML_SERVICE_API_BASE = https://<host>/ml
        # WebSocket sub-routes (/api/ws/*) need explicit Upgrade handling.
        location /ml/api/ws/ {
            set $upstream_ml http://brainkb-unified:8007;
            proxy_pass $upstream_ml/api/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 7d;
        }

        location /ml/ {
            set $upstream_ml http://brainkb-unified:8007;
            proxy_pass $upstream_ml/;
            # SSE for /api/synth-scholar/reviews/{id}/stream — disable
            # buffering so events flush to the browser immediately.
            proxy_buffering off;
            proxy_cache off;
        }

        # ── Query service (SPARQL, KG ingest) ──────────────────────────
        # NEXT_PUBLIC_*_QUERY_*  base = https://<host>/qry
        location /qry/ {
            set $upstream_query http://brainkb-unified:8010;
            proxy_pass $upstream_query/;
        }

        # ── Chat service (optional — chat_service compose) ─────────────
        # NEXT_PUBLIC_*_CHAT_SERVICE base = https://<host>/chat-svc
        location /chat-svc/ {
            set $upstream_chat http://brainkb-chat:8011;
            proxy_pass $upstream_chat/;
            proxy_buffering off;
        }

        # ── Next.js UI (catch-all) ─────────────────────────────────────
        # Must come last so the prefixed locations above win.
        location / {
            set $upstream_ui http://web:3000;
            proxy_pass $upstream_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
