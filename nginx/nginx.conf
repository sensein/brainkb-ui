# Thin reverse proxy for the BrainKB UI.
#
# This nginx fronts ONLY the Next.js UI on a friendly port (default 80) so
# you don't have to expose `:3000` directly to users. The BrainKB backend
# services keep their own host-mapped ports from docker-compose.unified.yml
# and are reached by the browser at:
#
#     http://<host>:8004   user-management (auth, users, admin, RBAC)
#     http://<host>:8007   ml service      (SynthScholar, NER, struct.res)
#     http://<host>:8010   query service   (SPARQL, KG ingest)
#     http://<host>:8011   chat service    (optional)
#
# That matches the .env.local / .env.deploy.example layout — each
# NEXT_PUBLIC_* URL points at its service's default port, no prefix
# rewriting. If you later want to consolidate everything behind one origin
# (e.g. for TLS via a single cert), add `location /<svc>/ { proxy_pass ... }`
# blocks per service and update the env vars to match.

worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # WebSocket / SSE upgrade map. Most "regular" requests have no Upgrade
    # header, in which case we want Connection: close (not "upgrade").
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Generous body size — the UI accepts file uploads (KG triples, PDFs).
    client_max_body_size 200M;

    # Use Docker's embedded DNS so the upstream is resolved lazily; this
    # lets nginx start even if the UI container is briefly down.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Common proxy headers — keep `X-Forwarded-Proto` accurate for the UI's
    # NextAuth callbacks (it builds OAuth callback URLs from these).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    server {
        listen 80 default_server;
        server_name _;

        location / {
            set $upstream_ui http://web:3000;
            proxy_pass $upstream_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Next.js streams responses for RSC / dynamic routes; don't
            # buffer them, otherwise the page hangs until the full reply
            # is collected by nginx.
            proxy_buffering off;
        }
    }
}
