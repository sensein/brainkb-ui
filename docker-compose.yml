# Production compose for the brainkb-ui Next.js app.
#
# Networking
#   Joins the external `brainkb-network` so the UI container can reach the
#   BrainKB backend stack (docker-compose.unified.yml). Create the network
#   once before bringing up either stack:
#       docker network create brainkb-network
#   Both stacks declare it as `external: true` and will fail fast if absent.
#
# NEXT_PUBLIC_* build args
#   Next.js inlines NEXT_PUBLIC_* into the client bundle at build time, so
#   these are URLs the user's **browser** ends up calling — they MUST be
#   reachable from the user's machine, not docker-internal hostnames. When
#   the UI is deployed on a remote host, set these in your shell (or in a
#   sibling .env file) before running `docker compose up --build`:
#       export NEXT_PUBLIC_USER_MANAGEMENT_API_BASE=https://api.example.com
#       export NEXT_PUBLIC_ML_SERVICE_API_BASE=https://api.example.com
#       ...
#   Anything left unset falls back to whatever is in .env.local.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_USER_MANAGEMENT_API_BASE: ${NEXT_PUBLIC_USER_MANAGEMENT_API_BASE-}
        NEXT_PUBLIC_ML_SERVICE_API_BASE: ${NEXT_PUBLIC_ML_SERVICE_API_BASE-}
        NEXT_PUBLIC_TOKEN_ENDPOINT_USER_MANAGEMENT_SERVICE: ${NEXT_PUBLIC_TOKEN_ENDPOINT_USER_MANAGEMENT_SERVICE-}
        NEXT_PUBLIC_TOKEN_ENDPOINT_ML_SERVICE: ${NEXT_PUBLIC_TOKEN_ENDPOINT_ML_SERVICE-}
        NEXT_PUBLIC_TOKEN_ENDPOINT_QUERY_SERVICE: ${NEXT_PUBLIC_TOKEN_ENDPOINT_QUERY_SERVICE-}
        NEXT_PUBLIC_TOKEN_ENDPOINT_CHAT_SERVICE: ${NEXT_PUBLIC_TOKEN_ENDPOINT_CHAT_SERVICE-}
        NEXT_PUBLIC_API_QUERY_ENDPOINT: ${NEXT_PUBLIC_API_QUERY_ENDPOINT-}
        NEXT_PUBLIC_API_NAMED_GRAPH_QUERY_ENDPOINT: ${NEXT_PUBLIC_API_NAMED_GRAPH_QUERY_ENDPOINT-}
        NEXT_PUBLIC_CHAT_SERVICE_API_ENDPOINT: ${NEXT_PUBLIC_CHAT_SERVICE_API_ENDPOINT-}
        NEXT_PUBLIC_API_NER_ENDPOINT: ${NEXT_PUBLIC_API_NER_ENDPOINT-}
        NEXT_PUBLIC_NER_GET_ENDPOINT: ${NEXT_PUBLIC_NER_GET_ENDPOINT-}
        NEXT_PUBLIC_NER_SAVE_ENDPOINT: ${NEXT_PUBLIC_NER_SAVE_ENDPOINT-}
        NEXT_PUBLIC_API_PDF2REPROSCHEMA_ENDPOINT: ${NEXT_PUBLIC_API_PDF2REPROSCHEMA_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_EXTRACT_STRUCTURED_RESOURCE_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_EXTRACT_STRUCTURED_RESOURCE_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_SAVE_STRUCTURED_RESOURCE_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_SAVE_STRUCTURED_RESOURCE_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_GET_STRUCTURED_RESOURCE_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_GET_STRUCTURED_RESOURCE_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_INSERT_KGS_JSONLD_TTL_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_INSERT_KGS_JSONLD_TTL_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_INSERT_KGS_JSONLD_TTL_JOB_STATUS_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_INSERT_KGS_JSONLD_TTL_JOB_STATUS_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_INSERT_ALL_KGS_JSONLD_TTL_JOB_STATUS_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_INSERT_ALL_KGS_JSONLD_TTL_JOB_STATUS_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_INSERT_RECOVERY_JOB_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_INSERT_RECOVERY_JOB_ENDPOINT-}
        NEXT_PUBLIC_API_ADMIN_INSERT_CHECK_RECOVERABLE_JOB_ENDPOINT: ${NEXT_PUBLIC_API_ADMIN_INSERT_CHECK_RECOVERABLE_JOB_ENDPOINT-}
        NEXT_PUBLIC_ENABLE_PAGE_ACCESS_GATE: ${NEXT_PUBLIC_ENABLE_PAGE_ACCESS_GATE-}
        NEXTAUTH_URL: ${NEXTAUTH_URL-}
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - brainkb-network

networks:
  brainkb-network:
    external: true
    name: brainkb-network
