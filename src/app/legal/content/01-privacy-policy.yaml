# The Privacy Policy, shown at /legal/privacy-policy. See README.md for the format.
id: privacy-policy
name: Privacy Policy
tagline: Cookies, sign-in data, tokens and who can see what you submit.
summary: >-
  Welcome to BrainKB. Your privacy is important to us, and we are committed to protecting your personal
  information. This Privacy Policy explains what data we collect, how we use it, and the measures we take to
  safeguard your information.
