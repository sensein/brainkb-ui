sections:
  - title: Information We Collect
    blocks:
      - h: Authentication Cookies
      - p: >-
          We use cookies to keep you signed in securely. Cookies are small data files stored on your device.
          For more details on how cookies work, you can refer to
          [HTTP cookies](https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies).
      - p: >-
          When you sign in, BrainKB sets a session cookie that keeps you signed in. It is removed when you sign
          out and otherwise expires after at most seven days. This cookie is necessary for signing in and is not
          used for analytics.
      - h: Analytics Cookies
      - p: >-
          With your consent, we use Google Tag Manager to collect analytics about how the website is used, so
          that we can improve it. Analytics are loaded only after you click "Accept" on the cookie banner; if you
          click "Decline", they are not loaded.
      - p: >-
          Your choice is stored in a cookie named `cookie_consent` for one year. You can change it by clearing
          that cookie in your browser, after which the banner will ask you again.
      - h: Personal Information
      - p: >-
          You can sign in with Globus, ORCID or GitHub. When you sign in, we receive basic profile details from
          the provider you choose, such as your name, email address, and your ORCID iD or GitHub username. This
          information is used solely for authentication and account management purposes.
      - h: Personal Access Tokens
      - p: >-
          If you create a personal access token (for example, to use BrainKB from the command line or an AI
          assistant), the token is linked to your account. It is shown to you once and stored only in hashed
          form. You can revoke your tokens at any time.

  - title: Use of Data
    blocks:
      - h: Data You Submit
      - p: >-
          Data you submit to BrainKB is stored in a space. Who can see it depends on the space's visibility,
          which its owner controls:
      - list:
          - "**Private spaces**: data is visible only to the space's members (owners, editors and viewers)."
          - "**Public spaces**: data can be read by anyone, including visitors who are not signed in."
          - >-
            Data becomes public only when its owner makes a space public, or submits it through a designated
            public-release workflow (see the [Fair Use Policy](/legal/fair-use)).

  - title: Contact
    blocks:
      - p: >-
          If you have questions about this Privacy Policy or how your data is handled, contact us at
          [tekraj@mit.edu](mailto:tekraj@mit.edu).
