# The Fair Use Policy for public-release data. See README.md for the format.
id: fair-use
name: Fair Use Policy
tagline: How public-release data, shared under CC0 1.0, may be reused.
summary: >-
  How data submitted through BrainKB's public-release workflows may be used, shared and redistributed.
