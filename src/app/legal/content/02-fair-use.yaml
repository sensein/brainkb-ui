sections:
  - title: Use of Public-Release Data
    blocks:
      - p: >-
          This Fair Use Policy applies only to data that the Platform identifies as public-release data. Certain
          data submission features, fields, or workflows are designated by the Platform as contributing to
          publicly accessible or openly released datasets. Only data submitted through these designated
          mechanisms will be distributed under the
          [CC0 1.0 (Creative Commons Zero)](https://creativecommons.org/publicdomain/zero/1.0/) public-domain
          dedication. By submitting data through these mechanisms, the user acknowledges and agrees to the
          following:
      - list:
          - >-
            Public-release data may be freely used, modified, redistributed, and incorporated into derivative
            works by any third party without restriction, consistent with CC0 1.0 (Creative Commons Zero).
          - >-
            The Platform may collect, process, analyze, or transform public-release data for research,
            evaluation, quality improvement, and dissemination.
          - >-
            The Platform may publish, share, or distribute aggregated, transformed, or derivative datasets created
            from public-release data for educational, scientific, or public-interest purposes.
      - callout:
          title: Do not submit personal or sensitive information
          text: >-
            Users must avoid submitting personal, sensitive, or confidential information within any data submitted
            through public-release mechanisms, as such data will become publicly accessible and cannot be withdrawn
            once released.

  - title: Contact
    blocks:
      - p: >-
          If you have questions about this Fair Use Policy, contact us at [tekraj@mit.edu](mailto:tekraj@mit.edu).
