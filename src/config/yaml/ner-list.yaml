type: "list"
route: "/knowledge-base/ner"
slug: "ner"
title: "Neuroscientific Named Entity Recognition (NER) Terms"
description: "Browse and search extracted neuroscientific named entities from research papers."
dataSource:
  type: "api-get"
  endpoint: "NEXT_PUBLIC_NER_GET_ENDPOINT"
  # Public page: no visitor credential exists, so use the withouttoken route.
  # It sends no Authorization header and targets ml_service's /api/public/*
  # endpoints. The authenticated route answers 403 "Not authenticated" for
  # anonymous callers, which is what broke this page.
  apiRoute: "/api/ner/withouttoken"
  params:
    tokenEndpointType: "ml"  # Options: "ml", "query", "default" (default: "query")
    useAuth: false  # Public page — see the note above; true would switch to the authenticated route
columns:
  - key: "entity"
    label: "Entity"
    type: "link"
    linkPath: "/knowledge-base/ner"
  - key: "label"
    label: "Label"
    type: "badge"
    badgeVariant: "secondary"
  - key: "paper_title"
    label: "Paper Title"
    type: "text"
  - key: "judge_score"
    label: "Judge Score"
    type: "badge"
    badgeVariant: "default"
itemsPerPage: 50
search:
  enabled: true
  placeholder: "Search entities, labels, papers, DOIs..."

