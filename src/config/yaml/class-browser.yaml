# Browse pages (/browse/<slug>)
#
# One entry under `pages` per Explore card that has its own browse page. Each
# page lists its classes down the left and the matching entities in a table.
# Adding a page — or a class, or a column — is a change here, not in code.
#
# `defaults` applies to every page; any page may override graph, columns or
# queryTemplate by setting its own.

defaults:
  # Named graph to query, substituted into queryTemplate as {{graph}}.
  # Change this to whichever graph the data was ingested into.
  graph: "https://brainkb.org/sandbox-sample/"

  # Table columns, in display order. Each `key` must match a variable selected
  # in queryTemplate; a row with no value for a column renders as "—".
  columns:
    - key: "id"
      label: "ID"
    - key: "name"
      label: "Name"
    - key: "full_name"
      label: "Full name"

  # Run once per selected class, with {{graph}} and {{category}} substituted.
  # name/full_name are OPTIONAL so an entity still lists when it only has an id.
  queryTemplate: |-
    PREFIX bican: <https://identifiers.org/brain-bican/vocab/>
    PREFIX biolink: <https://w3id.org/biolink/vocab/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    SELECT DISTINCT ?id ?name ?full_name
    WHERE {
      GRAPH <{{graph}}> {
        ?id biolink:category "{{category}}"^^xsd:anyURI .
        OPTIONAL { ?id biolink:name ?name }
        OPTIONAL { ?id biolink:full_name ?full_name }
      }
    }
    LIMIT 500

pages:
  - slug: "genes-genomes"
    title: "Genes & genomes"
    description: >-
      Individual genes with their molecular type — protein-coding or noncoding —
      linked to the versioned genome annotations from ENSEMBL or NCBI and the
      reference assemblies they came from.
    classes:
      - name: "GeneAnnotation"
        category: "bican:GeneAnnotation"
      - name: "GenomeAnnotation"
        category: "bican:GenomeAnnotation"
      - name: "GenomeAssembly"
        category: "bican:GenomeAssembly"
      - name: "AnnotationCollection"
        category: "bican:AnnotationCollection"

  # Diagnostic page, not linked from /explore: visit /browse/diagnostic signed
  # in to see what is actually in the store. Each entry overrides the query,
  # reusing the three columns as generic slots, so the labels below say what
  # each column holds. Keep this — running an arbitrary query otherwise needs
  # a signed-in session that curl cannot provide.
  - slug: "diagnostic"
    title: "Diagnostic"
    description: >-
      What is actually in the store, independent of any expected schema. Use
      this when a browse page returns nothing, to tell "wrong graph" from
      "wrong predicates" from "nothing ingested".
    columns:
      - key: "id"
        label: "1"
      - key: "name"
        label: "2"
      - key: "full_name"
        label: "3"
    classes:
      - name: "All graphs (1=graph, 2=triples)"
        category: ""
        queryTemplate: |-
          SELECT ?id (COUNT(*) AS ?name) WHERE {
            GRAPH ?id { ?s ?p ?o }
          }
          GROUP BY ?id
          ORDER BY DESC(?name)
          LIMIT 50
      - name: "Predicates here (1=predicate, 2=count)"
        category: ""
        queryTemplate: |-
          SELECT ?id (COUNT(*) AS ?name) WHERE {
            GRAPH <{{graph}}> { ?s ?id ?o }
          }
          GROUP BY ?id
          ORDER BY DESC(?name)
          LIMIT 50
      - name: "Category values (1=category, 2=count)"
        category: ""
        queryTemplate: |-
          PREFIX biolink: <https://w3id.org/biolink/vocab/>
          SELECT ?id (COUNT(*) AS ?name) WHERE {
            GRAPH <{{graph}}> { ?s biolink:category ?id }
          }
          GROUP BY ?id
          ORDER BY DESC(?name)
          LIMIT 50
      - name: "Raw triples (1=s, 2=p, 3=o)"
        category: ""
        queryTemplate: |-
          SELECT ?id ?name ?full_name WHERE {
            GRAPH <{{graph}}> { ?id ?name ?full_name }
          }
          LIMIT 100

  # BICAN library generation schema — the specimen-to-library chain. Classes
  # follow the order of the pipeline rather than the alphabet, so the list
  # reads as the process it describes.
  - slug: "library-generation"
    title: "Library generation"
    description: >-
      The path from donor to sequencing library: brain slabs and tissue
      samples, the dissociated, enriched, and barcoded cell samples derived
      from them, and the amplified cDNA, libraries, and aliquots they produce.
    classes:
      - name: "Donor"
        category: "bican:Donor"
      - name: "BrainSlab"
        category: "bican:BrainSlab"
      - name: "TissueSample"
        category: "bican:TissueSample"
      - name: "DissectionRoiPolygon"
        category: "bican:DissectionRoiPolygon"
      - name: "DissociatedCellSample"
        category: "bican:DissociatedCellSample"
      - name: "EnrichedCellSample"
        category: "bican:EnrichedCellSample"
      - name: "BarcodedCellSample"
        category: "bican:BarcodedCellSample"
      - name: "AmplifiedCdna"
        category: "bican:AmplifiedCdna"
      - name: "Library"
        category: "bican:Library"
      - name: "LibraryAliquot"
        category: "bican:LibraryAliquot"
