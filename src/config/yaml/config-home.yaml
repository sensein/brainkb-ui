  - name: "statistics boxheader"
    slug: "statisticsboxheader"
    title: "Knolwedge Base Statistics"
    subtitle: "Number of unique samples from different models."

  - name: "structured models boxheader"
    slug: "structuredmodelsheader"
    title: "Structured Models"
    subtitle: "Structured models used in BrainKB. <a href='https://sensein.group/brainkbdocs/' target='_blank'>Click here</a> to view all models."


structuredmodelsbox:
  - name: "GARS model"
    slug: "garsmodel"
    title: "Genome Annotation Schema"
    description: "A data model designed to represent types and relationships of an organism's annotated genome."
    links: "https://brain-bican.github.io/models/index_genome_annotation"
    icon_slug: "code"
  - name: "ansrs model"
    slug: "ansrsmodel"
    title: "Anatomical Structure Schema"
    description: "A data model designed to represent types and relationships of anatomical brain structures."
    links: "https://brain-bican.github.io/models/index_anatomical_structure"
    icon_slug: "layers"
  - name: "library model"
    slug: "librarygenerationschema"
    title: "Library Generation Schema"
    description: "A schema designed to represent types and relationships of samples and digital data assets generated during multimodal genomic data processes."
    links: "https://brain-bican.github.io/models/index_library_generation/"
    icon_slug: "bookopen"
  - name: "evidence assertion ontology"
    slug: "evidenceassertionontology"
    title: "Evidence Assertion Ontology"
    description: "A data model designed to represent types and relationships of evidence and assertions."
    links: "https://brain-bican.github.io/models/index_assertion_evidence/"
    icon_slug: "filecheck"

boxiconsstatisticscount:
  - name: "Species"
    slug: "species"
    short_description: ""
    icon_slug: "brain"
    sparql_query: |-
      PREFIX biolink: <https://w3id.org/biolink/vocab/> 
      select  (COUNT(DISTINCT(?o)) as ?count) where {
        GRAPH <https://test-upload.com/> {
          ?s <https://identifiers.org/brain-bican/vocab/species> ?o.
      }
      }
  - name: "Donor"
    slug: "donor"
    short_description: ""
    icon_slug: "database"
    sparql_query: |-
      PREFIX bican: <https://identifiers.org/brain-bican/vocab/> 
      PREFIX biolink: <https://w3id.org/biolink/vocab/>   
      SELECT DISTINCT (COUNT(?id) as ?count )
      WHERE {
        GRAPH <https://test-upload.com/> {
          ?id biolink:category "bican:Donor"^^<http://www.w3.org/2001/XMLSchema#anyURI>; 
        }
      }
  - name: "Structure"
    slug: "structure"
    short_description: ""
    icon_slug: "filetext"
    sparql_query: |-
      PREFIX bican: <https://identifiers.org/brain-bican/vocab/>  
      SELECT  (COUNT (DISTINCT(?id)) as ?count)
      WHERE {
        GRAPH <https://test-upload.com/> {
          ?id bican:structure ?o; 
        }
      }
  - name: "Library Aliquot"
    slug: "libraryaliquot"
    short_description: ""
    icon_slug: "users"
    sparql_query: |-
      PREFIX bican: <https://identifiers.org/brain-bican/vocab/> 
      PREFIX biolink: <https://w3id.org/biolink/vocab/>   
      SELECT  (COUNT(DISTINCT(?id)) as ?count )
      WHERE {
        GRAPH <https://test-upload.com/> {
            ?id biolink:category "bican:LibraryAliquot"^^<http://www.w3.org/2001/XMLSchema#anyURI>; 
        }
      }

whatisbrainkb:
  eyebrow: "What is BrainKB"
  title: "What is BrainKB?"
  headline: "A platform that turns scattered neuroscience knowledge into evidence you can query."
  description: "BrainKB structures and organizes scientific knowledge using knowledge graphs (KGs) — delivering evidence-based insights with provenance. Every assertion is traceable, every contribution reviewable, every dataset connected."
  subtitle: "BrainKB is a platform designed to support neuroscience research by structuring and organizing scientific knowledge using knowledge graphs (KGs) for delivering evidence-based insights."
  bullet_points:
    - heading: "Structured Knowledge"
      title: "Capture neuroscience findings as structured, queryable evidence in a shared knowledge graph."
    - heading: "Data Exploration"
      title: "Search, visualize, and analyze the graph through accessible, interactive tools."
    - heading: "Community Contribution"
      title: "Researchers contribute, review, and validate evidence with provenance."
    - heading: "Collaboration Hub"
      title: "A common workbench for neuroscientists to build on each other's findings."

usecases:
  eyebrow: "In Practice"
  title: "Use Cases"
  subtitle: "Where the toolkit meets real research. Each use case is developed in the open — with public inspection, interaction, and feedback at every stage."
  description: "Each use case includes ingestion, public view, and feedback components integrated with our Knowledge Graph"
  how_it_works:
    title: "How use cases work"
    subtitle: "Three open phases combine into one transparent knowledge-management system."
    phases:
      - label: "Inspection"
        description: "Data-provision mechanisms — public or member-only — depending on the use case."
      - label: "Public View"
        description: "Accessible interfaces for exploring and interacting with the knowledge graph."
      - label: "Public Feedback"
        description: "Community-driven validation mechanisms keep the graph trustworthy."
  cases:
    - title: "HMBA Taxonomy"
      case_number: "Case 1"
      description: "Hierarchical taxonomy management for neuroscience data classification and organization."
      icon_slug: "foldertree"
      gradient: "from-sky-500 to-blue-500"
      background_gradient: "from-sky-50 to-white"
      border_color: "sky-300"
      text_color: "sky-600"
      icon_color: "sky-500"
      discussion_link: "https://github.com/sensein/BrainKB/discussions/24"
      is_future: false
      status: "available"
      use_link: "/hmba-taxonomy"
      use_link_text: "View"
    - title: "Resources Extraction"
      case_number: "Case 2"
      description: "Extract and structure resources from unstructured documents and publications."
      icon_slug: "filesearch"
      gradient: "from-emerald-500 to-teal-500"
      background_gradient: "from-emerald-50 to-white"
      border_color: "emerald-300"
      text_color: "emerald-600"
      icon_color: "emerald-500"
      discussion_link: "https://github.com/sensein/BrainKB/discussions/28"
      is_future: false
      status: "available"
