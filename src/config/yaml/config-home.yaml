      discussion_link: ""
      is_future: true
      status: "coming_soon"
  info_box:
    title: "About Use Cases"
    description: "Each use case in BrainKB includes three key components that work together to create a comprehensive knowledge management system:"
    components:
      - label: "Ingestion Process"
        description: "Data submission mechanisms (public or maintainer-only, depending on the use case)"
      - label: "Public View & Interactions"
        description: "Accessible interfaces for exploring and interacting with the knowledge"
      - label: "Public Feedback"
        description: "Community input and validation mechanisms"
    status_info:
      title: "Development Status"
      description: "Use cases are marked with different statuses to indicate their current state:"
      statuses:
        - status: "available"
          label: "✓ Available"
          description: "Fully functional and ready to use. All components (ingestion, public view, and feedback) are complete and operational."
        - status: "partially_available"
          label: "⚡ Partially Available"
          description: "Some features are available to use, but not all components are complete. You can access the implemented features while development continues."
        - status: "in_development"
          label: "🚧 In Development"
          description: "Currently being actively developed. Features are being built and tested, but not yet ready for public use."
        - status: "coming_soon"
          label: "Coming Soon"
          description: "Planned for future implementation. This use case is under consideration but development has not yet started."
    footer_note: "All use cases are integrated with (or are on a process of integration) the BrainKB Knowledge Graph, enabling seamless data flow and comprehensive knowledge representation."
    discussion_link: "https://github.com/sensein/BrainKB/discussions/23"
    link_text: "View Full Planning Discussion"

tools:
  eyebrow: "The Toolkit"
  title: "BrainKB Tools"
  subtitle: "Open, composable engines for named-entity recognition, resource extraction, literature review, and concept mapping. Each works inside BrainKB — or standalone in your own research."
  more_link: "/tools-and-libraries"
  more_text: "View all tools"
  items:
    - name: "StructSense"
      category: "Entity Extraction"
      badge: "St"
      color: "#0f7a52"
      logo: "/structsense-logo.png"
      logo_orientation: "horizontal"
      description: "A task-agnostic agentic framework for structured information extraction from text and documents — with human-in-the-loop evaluation and benchmarking."
      link: "https://github.com/sensein/structsense"
      link_text: "Learn more"
    - name: "SynthScholar"
      category: "Literature Review"
      badge: "Sy"
      color: "#2563eb"
      logo: "/synthscholar-logo.png"
      logo_orientation: "horizontal"
      description: "PRISMA-guided literature review — from search strategy to screening, critical appraisal, and synthesis — orchestrated across multiple LLMs."
      link: "https://github.com/sensein/synthscholar"
      link_text: "Learn more"
    - name: "MeetGraph"
      category: "Knowledge Capture"
      badge: "Mg"
      color: "#b45309"
      logo: "/meet_graph_logo.png"
      logo_orientation: "square"
      description: "Turn meeting audio and notes into actionable knowledge graphs — extracting decisions, action items, and key concepts automatically."
      link: "https://github.com/sensein/meetgraph"
      link_text: "Learn more"
    - name: "Semantic Concept Mapper"
      category: "Ontology Mapping"
      badge: "Sm"
      color: "#7c3aed"
      logo: "/semantic_concept_mapper_logo_tr.png"
      logo_orientation: "square"
      description: "Map terms and concepts to standardized ontologies for consistent, interoperable, and machine-readable knowledge representations."
      link: "https://github.com/sensein/search_hybrid"
      link_text: "Learn more"

videos:
  # ── Fixed section header (stays constant as the carousel cycles) ──
  eyebrow: "See It in Action"
  title: "See It in Action"
  headline: "Watch BrainKB's tools work in practice."
  button_text: "Watch on YouTube"
  # Default supporting text — shown when the active video has no `description`
  description: ""
  # ── Per-video items (the player + its description cycle) ──
  items:
    - title: "MeetGraph · Turning meetings into a knowledge graph"
      description: "From a raw meeting recording to a structured, queryable knowledge graph in minutes — see how MeetGraph captures decisions, action items, and key concepts automatically."
      youtube_id: "GKdy1pDAbqo"

    - title: "SynthScholar · PRISMA-guided multi-agent system for systematic reviews"
      description: "From a research question to a structured, provenance-rich systematic review — SynthScholar uses multi-agent workflows to support literature discovery, screening, evidence extraction, appraisal, synthesis, and export."
      youtube_id: "DhHVc4Udfe0"

abstractatlas:
  eyebrow: "Explore"
  badge: ""
  title: "Browse the neuroscience landscape."
  description: "AbstractAtlas maps thousands of neuroscience abstracts — OHBM 2026 and NeuroScape PubMed 1999–2023 corpus — into an interactive 2D/3D UMAP projection. Search semantically, filter by facet, and see where any study sits within the wider literature."
  image: "/atlasabstract.png"
  link: "https://abstractatlas.brainkb.org/"
  button_text: "Open AbstractAtlas"

publications:
  eyebrow: "Under the Hood"
  title: "Powered by advanced AI agents."
  description: "BrainKB runs on cutting-edge agentic frameworks. StructSense enables sophisticated structured-information extraction; SynthScholar extends it to PRISMA-guided literature synthesis and critical appraisal across multiple LLMs."
  citation:
    label: "Research Citation:"
    text: "Chhetri, T.R., Chen, Y., Trivedi, P., Jarecka, D., Haobsh, S., Ray, P., Ng, L. and Ghosh, S.S., 2025. STRUCTSENSE: A Task-Agnostic Agentic Framework for Structured Information Extraction with Human-In-The-Loop Evaluation and Benchmarking. arXiv preprint arXiv:2507.03674."
    link: "https://arxiv.org/abs/2507.03674"
    button_text: "See Research Paper"
